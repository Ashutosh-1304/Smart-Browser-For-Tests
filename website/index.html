<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Smart Browser Teacher Hub — Generate secure test codes, configure proctoring strictness presets, and oversee student assessment integrity." />
  <title>Smart Browser — Teacher Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient Warm Lighting Blobs (Derived from User Palette) -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <!-- Main Floating Application Container (Finexy / Dashboard style) -->
  <div class="dashboard-shell">
    
    <!-- Top Navigation Bar -->
    <header class="app-topbar">
      <div class="topbar-left">
        <div class="logo-box">
          <!-- NeatIcons: shield.svg -->
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M4.75 11.5L4.75 7.295C4.75 6.038 5.253 5.309 6.428 4.864L11.078 3.1C11.723 2.855 12.277 2.855 12.922 3.1L17.572 4.864C18.747 5.309 19.25 6.038 19.25 7.295L19.25 11.5C19.25 16.25 15.75 19.75 12 21.25C8.25 19.75 4.75 16.25 4.75 11.5Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-info">
          <span class="brand-name">Smart Browser</span>
          <span class="brand-tag">Teacher Hub</span>
        </div>
      </div>

      <!-- Center Navigation Tabs -->
      <nav class="topbar-nav">
        <a href="#overview" class="nav-tab active">
          <!-- NeatIcons: layout-grid.svg -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <path d="M3.75 8.3C3.75 5.115 5.115 3.75 8.3 3.75L15.7 3.75C18.885 3.75 20.25 5.115 20.25 8.3L20.25 15.7C20.25 18.885 18.885 20.25 15.7 20.25L8.3 20.25C5.115 20.25 3.75 18.885 3.75 15.7L3.75 8.3Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3.75 12H20.25" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M12 3.75V20.25" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          Overview
        </a>
        <a href="#generator" class="nav-tab">
          <!-- NeatIcons: code.svg -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <path d="M7.5 7.25L3.853 10.897C3.081 11.669 3.081 12.331 3.853 13.103L7.5 16.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16.5 7.25L20.147 10.897C20.919 11.669 20.919 12.331 20.147 13.103L16.5 16.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 4.5L10 19.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Generator
        </a>
        <a href="#history" class="nav-tab">
          <!-- NeatIcons: clock.svg -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 7L12 11.564C12 11.869 12.111 12.069 12.371 12.228L15.25 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Recent Codes
        </a>
        <a href="dashboard.html" class="nav-tab nav-tab-invigilator">
          <!-- NeatIcons: monitor.svg -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <path d="M2.75 8.3C2.75 5.115 4.115 3.75 7.3 3.75L16.7 3.75C19.885 3.75 21.25 5.115 21.25 8.3L21.25 11.7C21.25 14.885 19.885 16.25 16.7 16.25L7.3 16.25C4.115 16.25 2.75 14.885 2.75 11.7L2.75 8.3Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 16.25V19.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M8 20.25H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Invigilator Console</span>
          <!-- NeatIcons: external-link.svg -->
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="opacity:0.75">
            <path d="M9.5 4.75L8 4.75C5.725 4.75 4.75 5.725 4.75 8L4.75 16C4.75 18.275 5.725 19.25 8 19.25L16 19.25C18.275 19.25 19.25 18.275 19.25 16L19.25 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M11.5 12.5L19.287 4.713" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 4.25L17.8 4.25C19.165 4.25 19.75 4.835 19.75 6.2L19.75 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </nav>

      <!-- Right Profile & Utilities -->
      <div class="topbar-right">
        <div class="quick-search-box">
          <!-- NeatIcons: search.svg -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <circle cx="10.5" cy="10.5" r="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15.6 15.6L20.5 20.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input type="text" id="topSearchInput" placeholder="Search codes..." />
        </div>

        <button class="topbar-icon-btn" title="Live Notifications" id="notificationBtn">
          <!-- NeatIcons: notification.svg -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M4.5 17.5H19.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5.5 17.5C5.5 14 5.5 10 12 10C18.5 10 18.5 14 18.5 17.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 20C10 21.104 10.896 22 12 22C13.104 22 14 21.104 14 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 4V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="badge-dot"></span>
        </button>

        <!-- Dark / Light Mode Switcher (Matching notification button style) -->
        <button class="topbar-icon-btn" id="topThemeToggle" title="Toggle Light / Dark Mode">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M12 2.5V4.5M12 19.5V21.5M4.5 12H2.5M21.5 12H19.5M5.28 5.28L6.7 6.7M17.3 17.3L18.72 18.72M5.28 18.72L6.7 17.3M17.3 6.7L18.72 5.28" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="user-profile-pill">
          <div class="avatar-circle">
            <!-- NeatIcons: user.svg -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="7.5" r="4.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4.5 19.5C4.5 15.634 7.858 12.5 12 12.5C16.142 12.5 19.5 15.634 19.5 19.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="user-meta">
            <span class="user-name">Prof. Mishra</span>
            <span class="user-role">Teacher Admin</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Shell Body: Slim Left Rail + Workspace -->
    <div class="app-body">
      
      <!-- Slim Navigation Rail -->
      <aside class="app-rail">
        <div class="rail-top">
          <!-- Theme Toggle: Light (Finexy) / Dark -->
          <div class="rail-theme-toggle" id="railThemeToggle">
            <button class="theme-icon-btn active" id="btnThemeLight" title="Light Theme (Finexy Style)">
              <!-- NeatIcons: sun / circle -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/>
                <path d="M12 2.5V4.5M12 19.5V21.5M4.5 12H2.5M21.5 12H19.5M5.28 5.28L6.7 6.7M17.3 17.3L18.72 18.72M5.28 18.72L6.7 17.3M17.3 6.7L18.72 5.28" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
            <button class="theme-icon-btn" id="btnThemeDark" title="Dark Theme">
              <!-- Moon -->
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <a href="#overview" class="rail-item active" title="Dashboard Overview">
            <!-- NeatIcons: layout-grid.svg -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M3.75 8.3C3.75 5.115 5.115 3.75 8.3 3.75L15.7 3.75C18.885 3.75 20.25 5.115 20.25 8.3L20.25 15.7C20.25 18.885 18.885 20.25 15.7 20.25L8.3 20.25C5.115 20.25 3.75 18.885 3.75 15.7L3.75 8.3Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3.75 12H20.25" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M12 3.75V20.25" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
          </a>
          <a href="#generator" class="rail-item" title="Assessment Code Generator">
            <!-- NeatIcons: code.svg -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M7.5 7.25L3.853 10.897C3.081 11.669 3.081 12.331 3.853 13.103L7.5 16.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M16.5 7.25L20.147 10.897C20.919 11.669 20.919 12.331 20.147 13.103L16.5 16.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M14 4.5L10 19.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <a href="#history" class="rail-item" title="Assessment History">
            <!-- NeatIcons: clock.svg -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 7L12 11.564C12 11.869 12.111 12.069 12.371 12.228L15.25 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <a href="dashboard.html" class="rail-item" title="Live Invigilator Console">
            <!-- NeatIcons: monitor.svg -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M2.75 8.3C2.75 5.115 4.115 3.75 7.3 3.75L16.7 3.75C19.885 3.75 21.25 5.115 21.25 8.3L21.25 11.7C21.25 14.885 19.885 16.25 16.7 16.25L7.3 16.25C4.115 16.25 2.75 14.885 2.75 11.7L2.75 8.3Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 16.25V19.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M8 20.25H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <a href="#customEditor" class="rail-item" title="Strictness Calibration">
            <!-- NeatIcons: sliders.svg -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <circle cx="15.5" cy="6" r="2.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="8.5" cy="12" r="2.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="14.5" cy="18" r="2.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3.75 6H13.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M17.75 6H20.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3.75 12H6.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M10.75 12H20.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3.75 18H12.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M16.75 18H20.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
        <div class="rail-bottom">
          <div class="rail-item status-pill-item" title="Service Connected (:3001)">
            <span class="status-indicator-dot online"></span>
          </div>
          <a href="https://github.com/Ashutosh-1304/Smart-Browser-For-Tests" target="_blank" class="rail-item" title="Help &amp; Documentation">
            <!-- NeatIcons: help-circle.svg -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9.5 9.25C9.5 7.87 10.62 6.75 12 6.75C13.38 6.75 14.5 7.87 14.5 9.25C14.5 10.82 12.87 11.53 12 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="16.5" r="0.75" fill="currentColor"/>
            </svg>
          </a>
        </div>
      </aside>

      <!-- Main Workspace -->
      <main class="app-workspace" id="overview">
        
        <!-- Header Greeting Row -->
        <section class="workspace-header">
          <div class="greeting-box">
            <h1 id="dynamicGreeting">Good morning, Professor</h1>
            <p>Generate secure test codes, enforce proctoring presets, and monitor student test integrity.</p>
          </div>
          <div class="header-actions">
            <a href="dashboard.html" class="btn-console-pill">
              <!-- NeatIcons: monitor.svg -->
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M2.75 8.3C2.75 5.115 4.115 3.75 7.3 3.75L16.7 3.75C19.885 3.75 21.25 5.115 21.25 8.3L21.25 11.7C21.25 14.885 19.885 16.25 16.7 16.25L7.3 16.25C4.115 16.25 2.75 14.885 2.75 11.7L2.75 8.3Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 16.25V19.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M8 20.25H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Launch Live Invigilator Grid</span>
              <!-- NeatIcons: arrow-right.svg -->
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                <path d="M4.5 12H19.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14.5 7L19.5 12L14.5 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
          </div>
        </section>

        <!-- Stat Metrics Grid (Actual Real Data) -->
        <section class="metrics-grid">

    </div>
  </div>
</body>
</html>
